# docker compose up --build      -> http://localhost:8000  (API + UI in one container, PostgreSQL behind it)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trafficvision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: trafficvision
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trafficvision"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (python -c "import secrets; print(secrets.token_urlsafe(48))")}
      DATABASE_URL: postgresql+psycopg://trafficvision:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/trafficvision
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin@12345}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:-Operator@12345}
      DEVICE: ${DEVICE:-cpu}
    volumes:
      - appdata:/app/backend/data
      - ./backend/models:/app/backend/models
      - ./sample_data:/app/sample_data
volumes:
  pgdata:
  appdata:
